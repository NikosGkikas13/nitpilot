name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nitpilot
          POSTGRES_PASSWORD: nitpilot
          POSTGRES_DB: nitpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nitpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nitpilot:nitpilot@localhost:5432/nitpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS, the same major as the Docker image (spec §17).
          node-version: 22.x
          cache: npm
      - run: npm ci
      # The script only exists once the server has a Prisma schema (Task 12).
      - run: npm run db:deploy --if-present -w apps/server
      - run: npm run typecheck
      # The web app's files, which the server serves (spec §7).
      - run: npm run build
      - run: npm run lint
      # The CLI package as npm would get it: a broken package.json or a missing file fails here, not at release.
      - run: npm run build -w apps/cli
      - run: npm publish -w apps/cli --dry-run
      # Runs every workspace's tests: protocol, server and CLI.
      - run: npm test
      # Plan 1 end to end: the server, two CLIs and the fake agent (spec §19).
      - run: npm run test:e2e
      # Plan 2: the web app in a real browser against that same setup (spec §19).
      # Chromium (about 150 MB) is kept between runs. Each Playwright version needs its own browser build, so the
      # cache is keyed on the installed version: a new Playwright downloads once, other dependency changes don't.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The cache holds the browser, not the system libraries it needs: those are installed on every run.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e -w apps/web
      # A failed test keeps its trace (playwright.config.ts): download it from the run's page and open it with
      # `npx playwright show-trace <trace.zip>` to step through what the browser saw.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  image:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only, never push (the release workflow pushes). The layers are cached between runs, so a change that
      # touches no dependency reuses the `npm ci` layers.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nitpilot:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts, serves the web app, stops cleanly on SIGTERM and starts again (scripts/image-smoke.sh).
      - run: bash scripts/image-smoke.sh
        env:
          NITPILOT_SMOKE_SKIP_BUILD: '1'

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole history, not just the latest commit: a key added in one commit and deleted in the next is still
      # readable by anyone who clones the public repo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks from its own image, pinned like every other tool here (the action version needs a licence for
      # repos owned by an organization). It reads every commit's diff with gitleaks' default rules plus the
      # allowlists in .gitleaks.toml (test values that look like secrets), and exits non-zero on a finding, which
      # fails the job. --redact keeps the value out of this public log; the log still names the file, line, commit
      # and rule.
      # Pinned by digest as well as tag: a Docker Hub tag can be repointed at a different image, a digest can't.
      - name: Scan every commit for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner --no-color
